<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Page not found | Sthiraka</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #14181d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 78% 28%, rgba(37, 91, 108, 0.065), transparent 32%),
          linear-gradient(180deg, #fffdf8 0%, #f5f1e8 72%, #f1eee6 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }

      article {
        width: min(100%, 46rem);
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid #d9d2c6;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: 0 24px 70px rgba(20, 24, 29, 0.08);
      }

      .brand,
      .kicker {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .brand {
        color: #14181d;
        text-decoration: none;
      }

      .kicker {
        margin: clamp(3rem, 10vw, 6rem) 0 1rem;
        color: #255b6c;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: clamp(2.7rem, 9vw, 5.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 0.98;
      }

      p:not(.kicker) {
        max-width: 38rem;
        margin: 1.5rem 0 2rem;
        color: #5f666d;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.65;
      }

      .action {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1rem;
        border-bottom: 2px solid #f2551d;
        color: #255b6c;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #f2551d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <article aria-labelledby="not-found-title">
        <a class="brand" href="/" aria-label="Sthiraka home">STHIRAKA</a>
        <p class="kicker">404 · NOT FOUND</p>
        <h1 id="not-found-title">That page isn’t here.</h1>
        <p>The address may have changed, or the page may no longer be available.</p>
        <a class="action" href="/">Return to the homepage</a>
      </article>
    </main>
  </body>
</html>
